<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI CRM Extractor</title>

  <style>
    :root {
      --primary: #0F9D8A;
      --sidebar-dark: #232734;
      --sidebar-dark-2: #2B3142;

      --bg-main: #F3F4F6;
      --card-bg: #FFFFFF;

      --text-primary: #1F2937;
      --text-secondary: #6B7280;

      --border: #D9DDE3;

      --shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.05);
      --shadow-button: 0 10px 24px rgba(15, 157, 138, 0.18);

      --danger: #C05656;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      min-height: 100vh;
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: Inter, "Segoe UI", sans-serif;
      font-size: 13px;
    }

    .shell {
      min-height: 100vh;
      background: var(--bg-main);
    }

    /* HERO */

    .hero {
      padding: 20px;
      background: linear-gradient(
        135deg,
        var(--sidebar-dark),
        var(--sidebar-dark-2)
      );
      color: white;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 16px;
      font-weight: 700;
      color: white;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.72);
    }

    /* METRIC */

    .metric-card {
      margin-top: 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 16px;

      border-radius: 16px;

      background: rgba(255, 255, 255, 0.05);

      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .metric-label {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.82);
    }

    .count {
      color: white;
      font-size: 13px;
      font-weight: 600;
    }

    .count strong {
      font-size: 38px;
      line-height: 1;
      font-weight: 700;
      margin-right: 4px;
    }

    /* ACTION */

    .actions {
      padding: 18px 20px 12px;
    }

    #extractBtn {
      width: 100%;
      height: 52px;

      border: none;
      border-radius: 14px;

      background: var(--primary);
      color: white;

      cursor: pointer;

      font-size: 14px;
      font-weight: 600;

      box-shadow: var(--shadow-button);

      transition: 0.2s ease;
    }

    #extractBtn:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    #extractBtn:disabled {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    /* STATUS */

    .status {
      min-height: 18px;
      padding: 0 20px 10px;

      font-size: 11px;
      font-weight: 500;

      color: var(--primary);
    }

    .status.error {
      color: var(--danger);
    }

    /* SOURCE */

    .source-card {
      margin: 0 20px;

      display: flex;
      align-items: center;
      gap: 12px;

      padding: 14px;

      background: var(--card-bg);

      border: 1px solid var(--border);
      border-radius: 16px;

      box-shadow: var(--shadow-soft);
    }

    .source-icon {
      width: 52px;
      height: 52px;

      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(15, 157, 138, 0.12);

      color: var(--primary);

      font-size: 12px;
      font-weight: 700;
    }

    .source-title {
      max-width: 210px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 13px;
      font-weight: 600;

      color: var(--text-primary);
    }

    .source-url {
      margin-top: 2px;

      max-width: 210px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 12px;
      font-weight: 400;

      color: var(--text-secondary);
    }

    /* CONTENT */

    .content {
      padding: 18px 20px 24px;
    }

    .section-head {
      margin-bottom: 14px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h2 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    #clearBtn {
      width: 38px;
      height: 38px;

      border-radius: 12px;

      border: 1px solid var(--border);

      background: white;

      color: var(--text-secondary);

      cursor: pointer;

      font-size: 13px;
      font-weight: 700;
    }

    /* PROFILES */

    .profiles {
      display: grid;
      gap: 12px;
    }

    .profile-card {
      display: flex;
      gap: 12px;
      align-items: center;

      padding: 14px;

      border-radius: 16px;

      background: white;

      border: 1px solid var(--border);

      border-left: 4px solid var(--primary);

      box-shadow: var(--shadow-soft);
    }

    .avatar {
      width: 48px;
      height: 48px;

      border-radius: 50%;

      background: var(--sidebar-dark);

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      color: white;

      font-size: 16px;
      font-weight: 700;
    }

    .profile-main {
      flex: 1;
      min-width: 0;
    }

    .profile-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 13px;
      font-weight: 700;

      color: var(--text-primary);
    }

    .profile-email,
    .profile-domain {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 12px;
      font-weight: 400;

      color: var(--text-secondary);
    }

    .profile-time {
      align-self: flex-start;

      font-size: 11px;
      font-weight: 600;

      color: var(--text-secondary);
    }

    .empty {
      padding: 24px;

      border-radius: 16px;

      border: 1px dashed var(--border);

      background: white;

      text-align: center;

      color: var(--text-secondary);

      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="shell">

    <!-- HERO -->
    <section class="hero">

      <div class="brand">
        <div class="brand-mark">AI</div>

        <div>
          <h1>Lead Scraper</h1>
          <div class="subtitle">Structured profile capture</div>
        </div>
      </div>

      <div class="metric-card">
        <div class="metric-label">Captured profiles</div>

        <div class="count">
          <strong id="profileCount">0</strong> total
        </div>
      </div>
    </section>

    <!-- ACTION -->
    <section class="actions">
      <button id="extractBtn" type="button">
        + Scrape profile
      </button>
    </section>

    <!-- STATUS -->
    <div class="status" id="statusText"></div>

    <!-- CURRENT PAGE -->
    <section class="source-card">
      <div class="source-icon">URL</div>

      <div>
        <div class="source-title" id="pageTitle">
          Current page
        </div>

        <div class="source-url" id="pageHost">
          Detecting...
        </div>
      </div>
    </section>

    <!-- RECENT -->
    <section class="content">

      <div class="section-head">
        <h2>Recent profiles</h2>

        <button
          id="clearBtn"
          type="button"
          aria-label="Clear recent profiles"
        >
          R
        </button>
      </div>

      <div class="profiles" id="profilesList"></div>

    </section>

  </main>

  <script src="popup.js"></script>
</body>
</html>
